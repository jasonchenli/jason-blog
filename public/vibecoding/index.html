<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Jason Chen</title>
  <meta name="description" content="Projects that I created or maintaining">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #555;
      min-height: 100vh;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 32px 100px;
      flex: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 60px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #222;
      margin-bottom: 8px;
    }

    header p {
      color: #888;
      font-size: 0.95rem;
    }

    .header-links {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .header-links a {
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .header-links a:hover {
      color: #111;
    }

    /* Section */
    .section {
      position: relative;
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 3.5rem;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: -16px;
      pointer-events: none;
      user-select: none;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 24px;
    }

    /* Project Item */
    .project {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      text-decoration: none;
      color: inherit;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .project:hover {
      background: #fafafa;
      margin: 0 -10px;
      padding: 12px 10px;
    }

    .project-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      color: #fff;
    }

    .project-icon.react {
      background: linear-gradient(135deg, #61dafb 0%, #0d7ea0 100%);
    }

    .project-icon.vite {
      background: linear-gradient(135deg, #bd34fe 0%, #41d1ff 100%);
    }

    .project-icon.ts {
      background: linear-gradient(135deg, #3178c6 0%, #235a97 100%);
    }

    .project-icon.tailwind {
      background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
    }

    .project-icon.echarts {
      background: linear-gradient(135deg, #e43961 0%, #aa154c 100%);
    }

    .project-icon.python {
      background: linear-gradient(135deg, #3776ab 0%, #ffd43b 100%);
    }

    .project-icon.pg {
      background: linear-gradient(135deg, #336791 0%, #234d6b 100%);
    }

    .project-icon.redis {
      background: linear-gradient(135deg, #dc382d 0%, #a41e35 100%);
    }

    .project-icon.pwa {
      background: linear-gradient(135deg, #5a0fc8 0%, #8b5cf6 100%);
    }

    .project-info {
      flex: 1;
      min-width: 0;
    }

    .project-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: #333;
      margin-bottom: 1px;
    }

    .project-desc {
      font-size: 0.78rem;
      color: #888;
      line-height: 1.4;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 0;
      color: #bbb;
      font-size: 0.85rem;
      margin-top: auto;
    }

    footer a {
      color: #888;
      text-decoration: none;
    }

    footer a:hover {
      color: #333;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .projects-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .section-title {
        font-size: 2.5rem;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 20px 60px;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 2rem;
        margin-bottom: -10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>Projects</h1>
      <p>Projects that I created or maintaining</p>
      <div class="header-links">
        <a href="https://github.com/Tingfing6/opennie" target="_blank">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
          </svg>
          GitHub
        </a>
      </div>
    </header>

    <!-- Current Focus -->
    <section class="section">
      <div class="section-title">Current Focus</div>
      <div class="projects-grid">
        <a href="https://opennie.myrightone.com/" target="_blank" class="project">
          <div class="project-icon">📊</div>
          <div class="project-info">
            <div class="project-name">Opennie</div>
            <div class="project-desc">AI-powered personal accounting app with natural language queries</div>
          </div>
        </a>
      </div>
    </section>
  </div>

  <footer>
    <a href="https://github.com/Tingfing6/opennie" target="_blank">@JasonChen</a>
  </footer>
</body>

</html>
